plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

def tomtomApiKey = project.findProperty("tomtomApiKey") ?: ""

android {
    namespace 'com.urbanflow.app'
    compileSdk 37

    androidResources {
        generateLocaleConfig false
    }

    defaultConfig {
        applicationId "com.urbanflow.app"
        minSdk 26
        targetSdk 36

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        resValue "string", "tomtom_api_key", "${tomtomApiKey}"

        missingDimensionStrategy 'tomtom-sdk-version', 'complete'

        versionCode 1
        versionName "1.0"

        buildConfigField "String", "TOMTOM_API_KEY", "\"${tomtomApiKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        compose true
        resValues true
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    implementation 'com.tomtom.sdk:init:2.6.4'
    implementation 'com.tomtom.sdk.maps:map-display-compose-standard:2.6.4'

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}